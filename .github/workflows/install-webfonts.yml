name: Install local webfonts

on:
  push:
    paths:
      - .github/workflows/install-webfonts.yml
      - fonts/charset.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare WOFF2 Korean subsets
        shell: bash
        run: |
          python -m pip install "fonttools[woff]>=4.55,<5"
          mkdir -p fonts/licenses
          python - <<'PY'
          from pathlib import Path
          from urllib.request import urlretrieve
          from fontTools import subset
          from fontTools.ttLib import TTFont
          
          root = Path('fonts')
          base = 'https://raw.githubusercontent.com/'
          sources = [
              ('orioncactus/pretendard/main/packages/pretendard/dist/web/variable/woff2/PretendardVariable.woff2', 'ym-sans.woff2'),
              ('google/fonts/main/ofl/gowunbatang/GowunBatang-Regular.ttf', 'ym-serif-regular.woff2'),
              ('google/fonts/main/ofl/gowunbatang/GowunBatang-Bold.ttf', 'ym-serif-bold.woff2'),
          ]
          licenses = [
              ('orioncactus/pretendard/main/LICENSE', 'licenses/pretendard-OFL.txt'),
              ('google/fonts/main/ofl/gowunbatang/OFL.txt', 'licenses/gowun-batang-OFL.txt'),
          ]
          for source, destination in licenses:
              urlretrieve(base + source, root / destination)
          charset = set(range(0x20,0x7f))
          charset.update(range(0x00a0,0x0100))
          charset.update(range(0x2000,0x2070))
          charset.update(range(0x3000,0x3040))
          charset.update(range(0x3130,0x3190))
          charset.update(range(0xff00,0xffef))
          # Keep the exact glyphs used in the published V2 introduction.
          charset.update(ord(c) for c in (root / 'charset.txt').read_text(encoding='utf-8'))
          for source, destination in sources:
              input_name = Path('/tmp') / Path(source).name
              urlretrieve(base + source, input_name)
              font = TTFont(input_name)
              is_serif = destination.startswith('ym-serif')
              is_bold = 'bold' in destination
              family = 'Lumo Serif' if is_serif else 'Lumo Sans'
              style = 'Bold' if is_bold else 'Regular'
              name_map = {1: family, 2: style, 4: family + ' ' + style,
                          6: family.replace(' ', '') + '-' + style,
                          16: family, 17: style}
              for name in font['name'].names:
                  if name.nameID in name_map:
                      name.string = name_map[name.nameID].encode(name.getEncoding())
              options = subset.Options()
              options.layout_features = ['*']
              options.name_IDs = ['*']
              options.name_legacy = True
              options.notdef_glyph = True
              ss = subset.Subsetter(options=options)
              ss.populate(unicodes=charset)
              ss.subset(font)
              font.flavor = 'woff2'
              out = root / destination
              font.save(out)
              print(destination, out.stat().st_size, 'bytes')
          PY
      - name: Commit font files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f fonts/pretendard-variable.woff2 fonts/gowun-batang-regular.woff2 fonts/gowun-batang-bold.woff2
          git add -A fonts/
          if ! git diff --cached --quiet; then
            git commit -m "Add locally hosted Pretendard and Gowun Batang WOFF2 fonts"
            git push
          fi
